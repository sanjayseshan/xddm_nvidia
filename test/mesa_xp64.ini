[binaries]
c = 'x86_64-w64-mingw32-gcc'
cpp = 'x86_64-w64-mingw32-g++-posix'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
c_args = ['-D_WIN32_WINNT=0x0502', '-DWINVER=0x0502', '-DNVX_XP_FUTEX=1', '-DNVX_XP_WIN32_SHIMS=1']
cpp_args = ['-D_WIN32_WINNT=0x0502', '-DWINVER=0x0502', '-DNVX_XP_FUTEX=1', '-DNVX_XP_WIN32_SHIMS=1']
c_link_args = ['-static']
cpp_link_args = ['-static']
